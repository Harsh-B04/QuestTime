<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="#0b0f19" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#bgGrad)" stroke-width="8" opacity="0.6" />

  <!-- Center Circle Shield -->
  <circle cx="256" cy="256" r="170" fill="url(#bgGrad)" filter="url(#glow)" opacity="0.9" />
  <circle cx="256" cy="256" r="150" fill="#0f172a" />

  <!-- Clock tick marks -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="6, 14" />

  <!-- Clock hands -->
  <!-- Hour hand pointing towards 2 o'clock -->
  <line x1="256" y1="256" x2="320" y2="190" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" />
  <!-- Minute hand pointing towards 12 o'clock -->
  <line x1="256" y1="256" x2="256" y2="150" stroke="#818cf8" stroke-width="8" stroke-linecap="round" />
  <!-- Center cap -->
  <circle cx="256" cy="256" r="14" fill="#fbbf24" />

  <!-- Gamification Sparkle / Flame Accent at bottom right -->
  <circle cx="370" cy="370" r="54" fill="#1e1b4b" stroke="url(#accentGrad)" stroke-width="6" />
  <path d="M370 338 C374 350 388 358 388 372 C388 384 379 392 370 392 C361 392 352 384 352 372 C352 356 366 350 370 338 Z" fill="url(#accentGrad)" />
</svg>